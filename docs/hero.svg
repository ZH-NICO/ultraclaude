<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="UltraClaude: several Claude Code agents around one shared memory, exchanging messages">
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; }
    .fg { fill: #e7e9eb; } .dim { fill: #a0a6ad; } .faint { fill: #78808a; }
    .link { stroke: #373d44; stroke-width: 1; }
    .name { font-size: 15px; font-weight: 600; fill: #e7e9eb; }
    .act { font-size: 12px; fill: #78808a; opacity: 0; }
    .mark { fill: #0f1113; stroke: #78808a; stroke-width: 1.6; }
    .pulse { fill: #e7e9eb; opacity: 0; }
    .trace { stroke: #78808a; stroke-width: 1; opacity: 0; }
    .ring { fill: none; stroke: #dba42a; stroke-width: 1.6; opacity: 0; transform-box: fill-box; transform-origin: center; }

    /* one 10 s loop: Bugfixer fixes and saves to memory, tells Tester, Reviewer ends up needing you */
    .bug   { animation: bug 10s linear infinite; }
    .test  { animation: test 10s linear infinite; }
    .rev   { animation: rev 10s linear infinite; }
    .dev   { fill: #46c26d; stroke: #46c26d; animation: breathe 1.8s ease-in-out infinite; }
    @keyframes bug  { 0%, 4% { fill: #0f1113; stroke: #78808a; } 6%, 52% { fill: #46c26d; stroke: #46c26d; } 56%, 100% { fill: #0f1113; stroke: #78808a; } }
    @keyframes test { 0%, 44% { fill: #0f1113; stroke: #78808a; } 47%, 88% { fill: #46c26d; stroke: #46c26d; } 92%, 100% { fill: #0f1113; stroke: #78808a; } }
    @keyframes rev  { 0%, 30% { fill: #0f1113; stroke: #78808a; } 33%, 66% { fill: #46c26d; stroke: #46c26d; } 69%, 100% { fill: #dba42a; stroke: #dba42a; } }
    @keyframes breathe { 50% { opacity: .4; } }

    .b-idle1 { animation: w0 10s linear infinite; } @keyframes w0 { 0%, 4% { opacity: 1; } 5%, 100% { opacity: 0; } }
    .b-read  { animation: w1 10s linear infinite; } @keyframes w1 { 0%, 5% { opacity: 0; } 6%, 20% { opacity: 1; } 21%, 100% { opacity: 0; } }
    .b-edit  { animation: w2 10s linear infinite; } @keyframes w2 { 0%, 21% { opacity: 0; } 22%, 34% { opacity: 1; } 35%, 100% { opacity: 0; } }
    .b-save  { animation: w3 10s linear infinite; } @keyframes w3 { 0%, 35% { opacity: 0; } 36%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
    .b-msg   { animation: w4 10s linear infinite; } @keyframes w4 { 0%, 45% { opacity: 0; } 46%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
    .b-idle2 { animation: w5 10s linear infinite; } @keyframes w5 { 0%, 55% { opacity: 0; } 56%, 100% { opacity: 1; } }
    .t-idle1 { animation: t0 10s linear infinite; } @keyframes t0 { 0%, 46% { opacity: 1; } 47%, 91% { opacity: 0; } 92%, 100% { opacity: 1; } }
    .t-run   { animation: t1 10s linear infinite; } @keyframes t1 { 0%, 46% { opacity: 0; } 47%, 91% { opacity: 1; } 92%, 100% { opacity: 0; } }
    .r-idle  { animation: r0 10s linear infinite; } @keyframes r0 { 0%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }
    .r-diff  { animation: r1 10s linear infinite; } @keyframes r1 { 0%, 32% { opacity: 0; } 33%, 67% { opacity: 1; } 68%, 100% { opacity: 0; } }
    .r-need  { animation: r2 10s linear infinite; fill: #dba42a; font-weight: 600; } @keyframes r2 { 0%, 68% { opacity: 0; } 69%, 100% { opacity: 1; } }
    .ping    { animation: ping 10s ease-out infinite; } @keyframes ping { 0%, 68% { opacity: 0; transform: scale(1); } 69% { opacity: 1; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(3.6); } }
    .count4  { animation: c4 10s linear infinite; } @keyframes c4 { 0%, 43% { opacity: 1; } 44%, 100% { opacity: 0; } }
    .count5  { animation: c5 10s linear infinite; } @keyframes c5 { 0%, 43% { opacity: 0; } 44%, 100% { opacity: 1; } }
    .caret   { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .act.b-edit, .act.t-idle1, .act.r-need { opacity: 1; } }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="12" fill="#0f1113" stroke="#24282d"/>

  <!-- left: name and what it is -->
  <g transform="translate(64 74) scale(2.2)" fill="#78808a" stroke="#78808a">
    <path d="M10 10V3.4M10 10l5.7 3.3M10 10l-5.7 3.3" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="2.4" stroke="none"/><circle cx="10" cy="3.4" r="1.7" stroke="none"/><circle cx="15.7" cy="13.3" r="1.7" stroke="none"/><circle cx="4.3" cy="13.3" r="1.7" stroke="none"/>
  </g>
  <text x="64" y="186" class="mono fg" font-size="52" font-weight="600" letter-spacing="-1">ultraclaude</text>
  <text x="66" y="230" class="sans dim" font-size="21">A team of Claude Code agents in one window.</text>
  <text x="66" y="260" class="sans dim" font-size="21">One shared memory. They talk to each other.</text>
  <rect x="64" y="296" width="238" height="42" rx="4" fill="#171a1d" stroke="#24282d"/>
  <text x="82" y="323" class="mono faint" font-size="17">$</text>
  <text x="102 112.4 122.8 133.2 143.6 154 164.4 174.8 185.2 195.6 206" y="323" class="mono fg" font-size="17">ultraclaude</text>
  <rect class="caret" x="220" y="308" width="9" height="19" fill="#e7e9eb"/>

  <!-- right: the team around its memory -->
  <g>
    <line class="link" x1="860" y1="76" x2="860" y2="200"/>
    <line class="link" x1="1010" y1="150" x2="860" y2="200"/>
    <line class="link" x1="955" y1="322" x2="860" y2="200"/>
    <line class="link" x1="765" y1="322" x2="860" y2="200"/>
    <line class="link" x1="710" y1="150" x2="860" y2="200"/>

    <!-- message Bugfixer → Tester -->
    <line class="trace" x1="860" y1="76" x2="1010" y2="150"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;0;0" keyTimes="0;.45;.46;.6;1"/></line>
    <circle class="pulse" r="4"><animateMotion dur="10s" repeatCount="indefinite" path="M860,76 L1010,150" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.45;.53;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.45;.455;.525;.53;1"/></circle>
    <!-- Bugfixer reads memory, then saves to it -->
    <circle class="pulse" r="4"><animateMotion dur="10s" repeatCount="indefinite" path="M860,200 L860,76" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.07;.14;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.07;.075;.135;.14;1"/></circle>
    <circle class="pulse" r="4"><animateMotion dur="10s" repeatCount="indefinite" path="M860,76 L860,200" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.36;.43;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.36;.365;.425;.43;1"/></circle>
    <!-- Tester reads what Bugfixer saved -->
    <circle class="pulse" r="4"><animateMotion dur="10s" repeatCount="indefinite" path="M860,200 L1010,150" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.58;.65;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.58;.585;.645;.65;1"/></circle>

    <rect x="806" y="176" width="108" height="48" rx="4" fill="#171a1d" stroke="#373d44"/>
    <text x="860" y="197" text-anchor="middle" class="sans name">Memory</text>
    <text x="860" y="215" text-anchor="middle" class="mono faint count4" font-size="12">4 notes</text>
    <text x="860" y="215" text-anchor="middle" class="mono faint count5" font-size="12">5 notes</text>

    <circle class="mark bug" cx="860" cy="76" r="7"/>
    <text x="860" y="38" text-anchor="middle" class="sans name">Bugfixer</text>
    <g class="mono" text-anchor="middle">
      <text x="860" y="57" class="act b-idle1">idle</text>
      <text x="860" y="57" class="act b-read">reading memory: token expiry</text>
      <text x="860" y="57" class="act b-edit">editing token.ts</text>
      <text x="860" y="57" class="act b-save">saving memory: Login bug 42</text>
      <text x="860" y="57" class="act b-msg">messaging Tester</text>
      <text x="860" y="57" class="act b-idle2">idle</text>
    </g>

    <circle class="mark test" cx="1010" cy="150" r="7"/>
    <text x="1028" y="148" class="sans name">Tester</text>
    <g class="mono"><text x="1028" y="167" class="act t-idle1">idle</text><text x="1028" y="167" class="act t-run">$ npm test -- auth</text></g>

    <circle class="mark rev" cx="955" cy="322" r="7"/>
    <circle class="ring ping" cx="955" cy="322" r="7"/>
    <text x="973" y="320" class="sans name">PR Reviewer</text>
    <g class="mono"><text x="973" y="339" class="act r-idle">idle</text><text x="973" y="339" class="act r-diff">$ gh pr diff 17</text><text x="973" y="339" class="act r-need">needs you</text></g>

    <circle class="mark dev" cx="765" cy="322" r="7"/>
    <text x="747" y="320" text-anchor="end" class="sans name">Developer</text>
    <text x="747" y="339" text-anchor="end" class="mono act" style="opacity:1">editing limiter.ts</text>

    <circle class="mark" cx="710" cy="150" r="7"/>
    <text x="692" y="148" text-anchor="end" class="sans name">Architect</text>
    <text x="692" y="167" text-anchor="end" class="mono act" style="opacity:1">idle</text>
  </g>
</svg>
