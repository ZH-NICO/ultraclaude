<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="UltraClaude: a team of Claude Code agents working around one shared memory, with every chat on your computer on a map around them">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7e9eb" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#e7e9eb" stop-opacity=".03"/>
      <stop offset="1" stop-color="#e7e9eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a0a6ad"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a0a6ad"/>
      <animate attributeName="x1" values="-300;700;700" keyTimes="0;.45;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1000;1000" keyTimes="0;.45;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1113" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1113"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; }
    .fg { fill: #e7e9eb; } .dim { fill: #a0a6ad; } .faint { fill: #78808a; }
    .spoke { stroke: #373d44; stroke-width: 1.2; }
    .ringline { fill: none; stroke: #24282d; stroke-width: 1; stroke-dasharray: 2 6; }
    .name { font-size: 15px; font-weight: 600; fill: #e7e9eb; }
    .act { font-size: 12px; fill: #78808a; }
    .mark { fill: #0f1113; stroke: #78808a; stroke-width: 1.6; }
    .orbit { transform-origin: 900px 260px; animation: spin 140s linear infinite; }
    .orbit2 { transform-origin: 900px 260px; animation: spin 220s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tw { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .25; } }
    .work { fill: #46c26d; stroke: #46c26d; animation: breathe 1.8s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .45; } }
    .need { fill: #dba42a; stroke: #dba42a; }
    .ping { fill: none; stroke: #dba42a; stroke-width: 1.6; transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .9; } 70%, 100% { transform: scale(3.4); opacity: 0; } }
    .halo { fill: none; stroke: #46c26d; stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-out infinite; }
    @keyframes halo { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .chip rect { fill: #171a1d; stroke: #24282d; }
    .chip text { font-size: 13px; fill: #a0a6ad; }
    .rot1 { animation: rot 9s steps(1) infinite; } .rot2 { animation: rot 9s steps(1) -3s infinite; } .rot3 { animation: rot 9s steps(1) -6s infinite; }
    @keyframes rot { 0%, 33% { opacity: 1; } 33.4%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x=".5" y=".5" width="1199" height="519" rx="14" fill="#0f1113" stroke="#24282d"/>
  <circle cx="900" cy="260" r="330" fill="url(#glow)"/>

  <!-- outer rings: every chat on your computer, slowly turning -->
  <circle class="ringline" cx="900" cy="260" r="238"/>
  <circle class="ringline" cx="900" cy="260" r="300"/>
  <g class="orbit">
    <g fill="#78808a">
      <circle cx="1138" cy="260" r="3"/><circle class="tw" cx="1129" cy="327" r="2.4"/><circle cx="1103" cy="388" r="3.5"/><circle cx="1063" cy="440" r="2.2"/>
      <circle class="tw" cx="1010" cy="477" r="3"/><circle cx="947" cy="494" r="2.6"/><circle cx="853" cy="494" r="3.4"/><circle class="tw" cx="790" cy="477" r="2.2"/>
      <circle cx="737" cy="440" r="3"/><circle cx="697" cy="388" r="2.4"/><circle class="tw" cx="671" cy="327" r="3.2"/><circle cx="662" cy="260" r="2.4"/>
      <circle cx="671" cy="193" r="3"/><circle class="tw" cx="697" cy="132" r="2.4"/><circle cx="737" cy="80" r="3.6"/><circle cx="790" cy="43" r="2.4"/>
      <circle class="tw" cx="853" cy="26" r="3"/><circle cx="947" cy="26" r="2.2"/><circle cx="1010" cy="43" r="3.2"/><circle class="tw" cx="1063" cy="80" r="2.6"/>
      <circle cx="1103" cy="132" r="3"/><circle cx="1129" cy="193" r="2.4"/>
    </g>
  </g>
  <g class="orbit2" fill="#373d44">
    <circle cx="1200" cy="260" r="2.4"/><circle cx="1160" cy="410" r="2"/><circle cx="1050" cy="520" r="2.4"/><circle cx="900" cy="560" r="2"/>
    <circle cx="750" cy="520" r="2.4"/><circle cx="640" cy="410" r="2"/><circle cx="600" cy="260" r="2.4"/><circle cx="640" cy="110" r="2"/>
    <circle cx="750" cy="0" r="2.4"/><circle cx="900" cy="-40" r="2"/><circle cx="1050" cy="0" r="2.4"/><circle cx="1160" cy="110" r="2"/>
  </g>

  <!-- the team around its memory -->
  <g>
    <line class="spoke" x1="900" y1="100" x2="900" y2="260"/>
    <line class="spoke" x1="1052" y1="210" x2="900" y2="260"/>
    <line class="spoke" x1="994" y1="390" x2="900" y2="260"/>
    <line class="spoke" x1="806" y1="390" x2="900" y2="260"/>
    <line class="spoke" x1="748" y1="210" x2="900" y2="260"/>

    <!-- Bugfixer reads memory, saves to it, tells the Tester; the Tester reads it -->
    <circle r="4" fill="#e7e9eb" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M900,260 L900,100" keyPoints="0;0;1;1" keyTimes="0;.05;.13;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.05;.06;.12;.13;1"/></circle>
    <circle r="4" fill="#e7e9eb" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M900,100 L900,260" keyPoints="0;0;1;1" keyTimes="0;.3;.38;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3;.31;.37;.38;1"/></circle>
    <line x1="900" y1="100" x2="1052" y2="210" stroke="#78808a" stroke-width="1" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;.9;0;0" keyTimes="0;.42;.43;.6;1"/></line>
    <circle r="4" fill="#e7e9eb" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M900,100 L1052,210" keyPoints="0;0;1;1" keyTimes="0;.42;.5;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.42;.43;.49;.5;1"/></circle>
    <circle r="4" fill="#e7e9eb" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M900,260 L1052,210" keyPoints="0;0;1;1" keyTimes="0;.56;.64;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.56;.57;.63;.64;1"/></circle>
    <line x1="806" y1="390" x2="994" y2="390" stroke="#78808a" stroke-width="1" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;.9;0;0" keyTimes="0;.72;.73;.9;1"/></line>
    <circle r="4" fill="#e7e9eb" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M806,390 L994,390" keyPoints="0;0;1;1" keyTimes="0;.72;.8;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.72;.73;.79;.8;1"/></circle>

    <rect x="842" y="234" width="116" height="52" rx="5" fill="#171a1d" stroke="#373d44"/>
    <text x="900" y="257" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#e7e9eb">Memory</text>
    <text x="900" y="275" text-anchor="middle" class="mono faint" font-size="12">Obsidian vault</text>

    <circle class="halo" cx="900" cy="100" r="8"/><circle class="mark work" cx="900" cy="100" r="8"/>
    <text x="900" y="66" text-anchor="middle" class="sans name">Bugfixer</text>
    <g class="mono act" text-anchor="middle"><text class="rot1" x="900" y="84">editing token.ts</text><text class="rot2" x="900" y="84" opacity="0">saving memory</text><text class="rot3" x="900" y="84" opacity="0">messaging Tester</text></g>

    <circle class="halo" cx="1052" cy="210" r="8"/><circle class="mark work" cx="1052" cy="210" r="8"/>
    <text x="1072" y="207" class="sans name">Tester</text>
    <text x="1072" y="226" class="mono act">$ npm test</text>

    <circle class="ping" cx="994" cy="390" r="8"/><circle class="mark need" cx="994" cy="390" r="8"/>
    <text x="1014" y="387" class="sans name">PR Reviewer</text>
    <text x="1014" y="406" class="mono" font-size="12" fill="#dba42a" font-weight="600">needs you</text>

    <circle class="halo" cx="806" cy="390" r="8"/><circle class="mark work" cx="806" cy="390" r="8"/>
    <text x="786" y="387" text-anchor="end" class="sans name">Developer</text>
    <text x="786" y="406" text-anchor="end" class="mono act">editing limiter.ts</text>

    <circle class="mark" cx="748" cy="210" r="8"/>
    <text x="728" y="207" text-anchor="end" class="sans name">Architect</text>
    <text x="728" y="226" text-anchor="end" class="mono act">idle</text>
  </g>

  <!-- left: the name and what it does -->
  <rect x="0" y="0" width="560" height="520" rx="14" fill="url(#fade)" transform="rotate(180 280 260)" opacity=".9"/>
  <g transform="translate(64 78) scale(2.4)" fill="#a0a6ad" stroke="#a0a6ad">
    <path d="M10 10V3.4M10 10l5.7 3.3M10 10l-5.7 3.3" stroke-width="1.1"/>
    <circle cx="10" cy="10" r="2.4" stroke="none"/><circle cx="10" cy="3.4" r="1.7" stroke="none"/><circle cx="15.7" cy="13.3" r="1.7" stroke="none"/><circle cx="4.3" cy="13.3" r="1.7" stroke="none"/>
  </g>
  <text x="62" y="196" class="mono" font-size="58" font-weight="700" letter-spacing="-1.5" fill="url(#shine)">ultraclaude</text>
  <text x="66" y="242" class="sans dim" font-size="22">A whole team of Claude Code agents.</text>
  <text x="66" y="274" class="sans dim" font-size="22">One shared memory. One window.</text>

  <g class="sans">
    <g class="chip"><rect x="64" y="304" width="138" height="30" rx="15"/><circle cx="82" cy="319" r="4" fill="#46c26d"/><text x="94" y="324">agents talk</text></g>
    <g class="chip"><rect x="212" y="304" width="160" height="30" rx="15"/><circle cx="230" cy="319" r="4" fill="#e7e9eb"/><text x="242" y="324">shared memory</text></g>
    <g class="chip"><rect x="382" y="304" width="164" height="30" rx="15"/><circle cx="400" cy="319" r="4" fill="#dba42a"/><text x="412" y="324">every chat, mapped</text></g>
  </g>

  <rect x="64" y="368" width="250" height="46" rx="6" fill="#171a1d" stroke="#24282d"/>
  <text x="84" y="397" class="mono faint" font-size="18">$</text>
  <text x="105 116.4 127.8 139.2 150.6 162 173.4 184.8 196.2 207.6 219" y="397" class="mono fg" font-size="18">ultraclaude</text>
  <rect class="caret" x="235" y="381" width="10" height="21" fill="#e7e9eb"/>
  <text x="66" y="456" class="sans faint" font-size="14">Run it in any folder. Open as many agents as you like.</text>
</svg>
